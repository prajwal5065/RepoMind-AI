name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend — lint, type-check, test, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Install dev/CI tooling
        run: pip install -r requirements-dev.txt

      - name: Flake8 (style)
        run: flake8 . --max-line-length=120 --exclude=venv,data
        continue-on-error: true

      - name: Pylint (quality)
        run: pylint --disable=all --enable=E,F $(git ls-files '*.py')
        continue-on-error: true

      - name: MyPy (types)
        run: mypy . --ignore-missing-imports
        continue-on-error: true

      - name: Bandit (security — Python)
        run: bandit -r . -x ./tests,./venv -ll

      - name: pip-audit (dependency CVEs)
        # Known open item, not swept under the rug: `starlette` is pulled
        # in transitively by fastapi==0.115.5, and its fix versions require
        # a starlette 1.x major bump — which in turn needs a FastAPI upgrade
        # and a full regression pass, not a blind version bump in CI.
        # Tracked IDs below are re-audited on every run (nothing else is
        # exempted) — remove this ignore list once FastAPI is upgraded.
        run: >
          pip-audit -r requirements.txt
          --ignore-vuln PYSEC-2026-161
          --ignore-vuln PYSEC-2026-248
          --ignore-vuln PYSEC-2026-249
          --ignore-vuln PYSEC-2026-1941
          --ignore-vuln PYSEC-2026-1942
          --ignore-vuln PYSEC-2026-2280
          --ignore-vuln PYSEC-2026-2281

      - name: Run tests
        run: pytest ../tests -v

  frontend-build:
    name: Frontend — install & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
